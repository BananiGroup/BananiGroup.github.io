<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Cocktail</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 24px;
      font-family: Arial, sans-serif;
      background: #1c1c1c;
      color: #f2f2f2;
    }

    h1 {
      margin: 0 0 20px;
      text-align: center;
      font-size: clamp(2.5rem, 6vw, 5rem);
      color: #d6d6d6;
    }

    h3 {
      margin: 0 0 30px;
      text-align: center;
      font-size: clamp(1rem, 2vw, 1.4rem);
      color: #d6d6d6;
    }

    .cocktail-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .cocktail-card {
      display: flex;
      align-items: center;
      min-height: 190px;
      padding: 18px;
      border-radius: 20px;
      background: #292929;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .cocktail-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55);
    }

    .cocktail-card.sold-out::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
    }

    .cocktail-card.sold-out::after {
      content: "SOLD OUT";
      position: absolute;
      inset: 25% -50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 0, 0, 0.65);
      color: #e05252;
      font-size: 3.5rem;
      font-weight: bold;
      letter-spacing: 2px;
      transform: rotate(-8deg);
      height: 50%;
      width: 200%;
    }

    .cocktail-image {
      width: 140px;
      height: 150px;
      object-fit: cover;
      object-position: center;
      border-radius: 14px;
      flex-shrink: 0;
      background: #3a3a3a;
    }

    .cocktail-info {
      padding: 0 10px 0 22px;
    }

    .cocktail-info h2 {
      margin: 0 0 10px;
      font-size: 1.5rem;
      color: #d6d6d6;
    }

    .cocktail-info p {
      margin: 0;
      line-height: 1.5;
      color: #b8b8b8;
    }

    @media (max-width: 700px) {
      .cocktail-list {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 450px) {
      .cocktail-card {
        min-height: 150px;
        padding: 12px;
      }

      .cocktail-image {
        width: 100px;
        height: 120px;
      }

      .cocktail-info {
        padding-left: 14px;
      }

      .cocktail-info h2 {
        font-size: 1.2rem;
      }

      .cocktail-info p {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <h1>Menu Cocktail</h1>

  <h3>Ricaricare la pagina prima di ogni ordinazione per controllare la disponibilità</h3>

  <main id="cocktail-list" class="cocktail-list"></main>

  <script>
    const cocktails = [
      {
        name: "Classic Margarita",
        description: "A refreshing blend of tequila, lime juice, and orange liqueur.",
        image: "https://placehold.co/280x300/e8b4a0/ffffff?text=Margarita",
        available: true
      },
      {
        name: "Mojito",
        description: "White rum, fresh mint, lime, sugar, and sparkling soda water.",
        image: "https://placehold.co/280x300/b8d8ba/ffffff?text=Mojito",
        available: false
      },
      {
        name: "Old Fashioned",
        description: "Bourbon, bitters, and a touch of sugar served over ice.",
        image: "old-fashioned.png",
        available: true
      },
      {
        name: "Strawberry Daiquiri",
        description: "A sweet and fruity combination of rum, strawberries, and lime.",
        image: "https://placehold.co/280x300/e98d9d/ffffff?text=Daiquiri",
        available: true
      },
      {
        name: "Negroni",
        description: "A bittersweet Italian cocktail made with gin, vermouth, and Campari.",
        image: "https://placehold.co/280x300/c94c4c/ffffff?text=Negroni",
        available: true
      },
      {
        name: "Piña Colada",
        description: "A tropical mix of rum, coconut cream, and pineapple juice.",
        image: "https://placehold.co/280x300/f2d49b/ffffff?text=Pina+Colada",
        available: true
      },
      {
        name: "Moscow Mule",
        description: "Vodka, ginger beer, and lime served in a refreshing combination.",
        image: "https://placehold.co/280x300/d9a66f/ffffff?text=Moscow+Mule",
        available: false
      },
      {
        name: "Blue Lagoon",
        description: "A bright, citrusy cocktail with vodka, blue curaçao, and lemonade.",
        image: "https://placehold.co/280x300/73b9d6/ffffff?text=Blue+Lagoon",
        available: true
      }
    ];

    const cocktailList = document.getElementById("cocktail-list");

    cocktails.forEach((cocktail) => {
      const card = document.createElement("article");
      card.className = `cocktail-card ${
        cocktail.available ? "" : "sold-out"
      }`;

      card.innerHTML = `
        <img
          class="cocktail-image"
          src="${cocktail.image}"
          alt="${cocktail.name}"
        />

        <div class="cocktail-info">
          <h2>${cocktail.name}</h2>
          <p>${cocktail.description}</p>
        </div>
      `;

      cocktailList.appendChild(card);
    });
  </script>
</body>
</html>
