<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Cocktail</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      position: relative;
      margin: 0;
      padding: 40px 24px;
      font-family: Arial, sans-serif;
      color: #f2f2f2;
      background: #1c1c1c;
    }

    /* Fantasy background */
    body::before {
      content: "";
      position: fixed;
      z-index: -1;
      top: 0;
      bottom: 0;
      left: 0;
      width: 55%;
    
      background-image:
        linear-gradient(
          to right,
          rgba(36, 29, 45, 0) 0%,
          rgba(36, 29, 45, 0) 55%,
          rgba(36, 29, 45, 1) 100%
        ),
        url("pattern-background-fantasy.png");
    
      background-color: #241d2d;
      background-repeat: no-repeat, repeat;
      background-position: center, top left;
      background-size: 100% 100%, 220px 220px;
    }
    
    /* Sci-fi background */
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      top: 0;
      bottom: 0;
      right: 0;
      width: 55%;
    
      background-image:
        linear-gradient(
          to left,
          rgba(24, 37, 44, 0) 0%,
          rgba(24, 37, 44, 0) 55%,
          rgba(24, 37, 44, 1) 100%
        ),
        url("pattern-background-scifi.png");
    
      background-color: #18252c;
      background-repeat: no-repeat, repeat;
      background-position: center, top left;
      background-size: 100% 100%, 220px 220px;
    }

    h1 {
      margin: 0 0 20px;
      text-align: center;
      font-size: clamp(2.5rem, 6vw, 5rem);
      color: #d6d6d6;
    }

    h3 {
      margin: 0 0 30px;
      text-align: center;
      font-size: clamp(1rem, 2vw, 1.4rem);
      color: #d6d6d6;
    }

    .cocktail-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .cocktail-card {
      display: flex;
      align-items: center;
      min-height: 190px;
      padding: 18px;
      border-radius: 20px;
      background: #292929;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .cocktail-card.sold-out::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
    }

    .cocktail-card.sold-out::after {
      content: "SOLD OUT";
      position: absolute;
      inset: 25% -50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 0, 0, 0.5);
      color: #e05252;
      font-size: 3.5rem;
      font-weight: bold;
      letter-spacing: 2px;
      transform: rotate(-12deg);
      height: 50%;
      width: 200%;
    }

    .cocktail-image {
      width: 140px;
      height: 150px;
      object-fit: cover;
      object-position: center;
      border-radius: 14px;
      flex-shrink: 0;
      background: #3a3a3a;
    }

    .cocktail-info {
      padding: 0 10px 0 22px;
    }

    .cocktail-info h2 {
      margin: 0 0 10px;
      font-size: 1.5rem;
      color: #d6d6d6;
    }

    .cocktail-info p {
      margin: 0;
      line-height: 1.5;
      color: #b8b8b8;
    }

    @media (max-width: 700px) {
      .cocktail-list {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 450px) {
      .cocktail-card {
        min-height: 150px;
        padding: 12px;
      }

      .cocktail-image {
        width: 100px;
        height: 120px;
      }

      .cocktail-info {
        padding-left: 14px;
      }

      .cocktail-info h2 {
        font-size: 1.2rem;
      }

      .cocktail-info p {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <h1>Menu Cocktail</h1>

  <h3>Ricaricare la pagina prima di ogni ordinazione per verificare la disponibilità</h3>

  <main id="cocktail-list" class="cocktail-list"></main>

  <script>
    const cocktails = [
      {
        name: "Cola Bottle Libre",
        description: "Un twist dolce sul classico Cuba Libre",
        image: "https://placehold.co/280x300/e8b4a0/ffffff?text=Image",
        available: true
      },
      {
        name: "Long Island Iced Tea",
        description: "Description",
        image: "https://placehold.co/280x300/e8b4a0/ffffff?text=Image",
        available: true
      },
      {
        name: "Gin Tonic",
        description: "Description",
        image: "https://placehold.co/280x300/e8b4a0/ffffff?text=Image",
        available: true
      },
      {
        name: "Gin Lemon",
        description: "Description",
        image: "https://placehold.co/280x300/e8b4a0/ffffff?text=Image",
        available: true
      },
      {
        name: "Gin Loco",
        description: "Description",
        image: "https://placehold.co/280x300/e8b4a0/ffffff?text=Image",
        available: true
      },
      {
        name: "Iceless Mojito",
        description: "Description",
        image: "https://placehold.co/280x300/e8b4a0/ffffff?text=Image",
        available: true
      },
      {
        name: "Bloody Mary",
        description: "Description",
        image: "https://placehold.co/280x300/e8b4a0/ffffff?text=Image",
        available: true
      },
      {
        name: "Name",
        description: "Description",
        image: "https://placehold.co/280x300/e8b4a0/ffffff?text=Image",
        available: true
      },
    ];

    const cocktailList = document.getElementById("cocktail-list");

    cocktails.forEach((cocktail) => {
      const card = document.createElement("article");
      card.className = `cocktail-card ${
        cocktail.available ? "" : "sold-out"
      }`;

      card.innerHTML = `
        <img
          class="cocktail-image"
          src="${cocktail.image}"
          alt="${cocktail.name}"
        />

        <div class="cocktail-info">
          <h2>${cocktail.name}</h2>
          <p>${cocktail.description}</p>
        </div>
      `;

      cocktailList.appendChild(card);
    });
  </script>
</body>
</html>
